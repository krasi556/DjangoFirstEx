<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Directory{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            min-height: 100vh;
            color: #1f2937;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-shell {
            padding: 2.5rem 0 3rem;
        }

        .page-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 1.25rem;
            box-shadow: 0 1rem 2rem rgba(15, 23, 42, 0.08);
        }

        .navbar {
            background: linear-gradient(90deg, #111827 0%, #1f2937 100%) !important;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .section-title {
            font-size: clamp(1.8rem, 2vw, 2.5rem);
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 1.5rem;
        }

        .detail-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 0.4rem;
        }

        .list-group-item {
            border-radius: 0.85rem !important;
            border: 1px solid rgba(148, 163, 184, 0.2);
            margin-bottom: 0.75rem;
            padding: 1rem 1.1rem;
        }

        .employee-card {
            border-left: 0.35rem solid #4f46e5;
        }

        .badge-soft {
            background-color: #eef2ff;
            color: #4338ca;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        }

        .alert-info {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'core:homepage' %}">Employee Hub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'core:homepage' %}">Homepage</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'people:people' %}">Employees</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="page-shell">
        <div class="container">
            <div class="page-card p-4 p-md-5">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-4">
        © {{ year|default:"2026" }} Employee Directory
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
