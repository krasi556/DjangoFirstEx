{% extends 'base_nav.html' %}

{% block content %}
<p>The employees we have are:</p>
<ul>
    {% for employee in context %}
        <li style="padding-top: 1em">
            <a href="{% url 'people:person_detail' person_id=employee.id %}">
                {{ employee.name }}
            </a>
        </li>
    {% empty %}
        <li>We got no employees</li>
    {% endfor %}
</ul>
{% endblock %}
