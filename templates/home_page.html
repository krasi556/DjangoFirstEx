{% extends 'base_nav.html' %}

{% block title %}Home{% endblock %}

{% block content %}
<h1 class="section-title">Our employees</h1>
<div class="list-group">
    {% for employee in context %}
        <a class="list-group-item list-group-item-action employee-card" href="{% url 'people:person_detail' person_id=employee.id name_slug=employee.name|slugify %}">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <div class="detail-label">Employee</div>
                    <h5 class="mb-1">{{ employee.name }}</h5>
                </div>
                <span class="badge rounded-pill badge-soft">View profile</span>
            </div>
        </a>
    {% empty %}
        <div class="alert alert-info mb-0">We got no employees.</div>
    {% endfor %}
</div>
{% endblock %}
