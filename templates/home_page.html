<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to home page</title>
</head>
<body>
<p>The employees we have are:</p>
<ul>
    {% for employee in context %}
        <li>
            <a href="{% url 'people:person_detail' person_id=employee.id name_slug=employee.name|slugify %}">
                {{ employee.name }}
            </a>
        </li>
    {% empty %}
        <p>We got no employees</p>
    {% endfor %}
</ul>
</body>
</html>
